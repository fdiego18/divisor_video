name: Windows x64 — build e empacotamento (não certifica GUI)
on:
  workflow_dispatch:
  push:
    tags: ['windows-v*']
permissions:
  contents: read
concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ferramentas:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Instalar compilador cruzado e ferramentas de autenticação
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 nasm make pkg-config curl gnupg jq zip
      - name: Compilar fonte oficial estável com assinatura verificada
        run: |
          mkdir -p build/windows-deps
          bash empacotamento/windows/compilar_ffmpeg.sh 2>&1 | tee build/windows-deps/compilacao-ffmpeg.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-lgpl-windows-x64
          path: |
            build/windows-deps/compilacao-ffmpeg.log
            build/windows-deps/bin
            build/windows-deps/licencas
            build/windows-deps/fontes-correspondentes.zip
          if-no-files-found: error
          retention-days: 30
  aplicativo:
    needs: ferramentas
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ffmpeg-lgpl-windows-x64
          path: build/windows-deps
      - name: Preparar Rust, MSVC e cache (somente ambiente de build)
        shell: pwsh
        run: |
          foreach ($script in (Get-ChildItem empacotamento/windows/*.ps1)) {
            $tokens = $null; $erros = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$erros)
            if ($erros.Count -gt 0) { throw ($erros | Out-String) }
          }
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy,rust-src,rust-docs --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw 'Rust indisponível' }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($entry in (Get-ChildItem Env:)) { if ($entry.Name -in @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion')) { "$($entry.Name)=$($entry.Value)" >> $env:GITHUB_ENV } }
          cargo fetch --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE) { throw 'Cache Cargo incompleto' }
      - name: Preparar fontes, avisos e FFmpeg exclusivo dos testes antigos
        shell: pwsh
        run: |
          ./empacotamento/windows/preparar_licencas.ps1 -PastaDependencias build/windows-deps
          $bin = ./empacotamento/windows/obter_ffmpeg_testes.ps1 -Destino "$env:RUNNER_TEMP\ffmpeg-testes"
          "FFMPEG_TEST_BIN=$bin" >> $env:GITHUB_ENV
      - name: Compilar, testar, auditar PE e gerar os três formatos
        shell: pwsh
        run: |
          New-Item dist/windows-x64 -ItemType Directory -Force | Out-Null
          Start-Transcript dist/windows-x64/compilacao-windows.log
          try {
            $deps = (Resolve-Path build/windows-deps).Path
            $hashes = Get-Content "$deps/licencas/DEPENDENCIAS.json" -Raw | ConvertFrom-Json
            ./empacotamento/windows/empacotar_windows.ps1 -PastaFfmpegBin "$deps/bin" -Sha256Ffmpeg $hashes.binaries.'ffmpeg.exe'.sha256 -Sha256Ffprobe $hashes.binaries.'ffprobe.exe'.sha256 -PastaLicencas "$deps/licencas" -FontesCorrespondentesZip "$deps/fontes-correspondentes.zip" -PastaFfmpegTeste $env:FFMPEG_TEST_BIN -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            Copy-Item "$env:RUNNER_TEMP/ffmpeg-testes/PROVENIENCIA-TESTES.json" dist/windows-x64/
          } finally { Stop-Transcript }
      - name: Testar pacotes com PATH restrito e registrar módulos carregados
        shell: pwsh
        run: |
          ./empacotamento/windows/testar_distribuicao.ps1 -Dist dist/windows-x64
      - name: Registrar entrega e pendências mesmo em falha
        if: always()
        shell: pwsh
        run: |
          New-Item dist/windows-x64 -ItemType Directory -Force | Out-Null
          ./empacotamento/windows/gerar_relatorio.ps1 -Dist dist/windows-x64
      - name: Publicar artefatos e evidências, sem declarar validação gráfica
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DivisorVideo-Windows-x64-nao-certificado
          path: dist/windows-x64/
          if-no-files-found: error
          retention-days: 30
